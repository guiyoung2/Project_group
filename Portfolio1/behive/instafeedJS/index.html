<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #instagram_feed {
        width: 80%;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      #instagram_feed .item {
        /* width: 23%; */
        list-style: none;
        width: 250px;
        height: 250px;
        /* height: auto; */
      }
      #instagram_feed .item img {
        /* height: 100%; */
        /* width: 100%; */
        width: 250px;
        height: 250px;
        background-size: cover;
      }
      .click {
        width: 300px;
        height: 300px;
        display: block;
        background: #dfc;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="instagram_feed"></div>
    <div class="click"></div>

    <script type="text/javascript" src="./instafeed.min.js"></script>
    <script type="text/javascript">
      let n = 6;
      let ev = document.querySelector(".click");
      ev.addEventListener("click", function () {
        n += 6;
        console.log(n);
        feed.run();
      });

      const feed = new Instafeed({
        accessToken:
          "IGQVJWWTVhTnpHS1pHcHREUS1PT2Y2cXV2MXVkaTRRbVZACcHJ4OFhYSFNJNHRKQXBQY2w4Q1UwWnhIaE1qVVJJcUkzdS15R1gxZA0h2MWZA4LWlZAdnB6bXdLVjhCRVJBTUVpQXNVWGU4UnJNdkxBVkhUYUxmNzU0U2NUZA3FF",
        target: "instagram_feed",
        template:
          '<li class="item">' +
          '<a href="{{link}}">' +
          '<img title="{{caption}}" src="{{image}}"/>' +
          //   "<h3>{{caption}}</h3>" +
          //   "<div>{{username}}</div>" +
          "</a>" +
          "</li>",
        limit: n,
      });

      feed.run();
    </script>
  </body>
</html>
